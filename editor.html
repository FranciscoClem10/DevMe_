<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevMe Editor de Niveles</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f0e0; color: #1c180d; }
    
    /* Header */
    .header { background: #fff; border-bottom: 2px solid #e8e2ce; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; }
    .header h1 { font-size: 18px; color: #f4c025; }
    .header a { color: #9c8749; text-decoration: none; font-size: 13px; }
    .header a:hover { color: #f4c025; }
    
    /* Main layout */
    .main { display: flex; height: calc(100vh - 50px); }
    
    /* Sidebar */
    .sidebar { width: 200px; background: #fff; border-right: 2px solid #e8e2ce; padding: 15px; overflow-y: auto; }
    .sidebar h3 { font-size: 12px; text-transform: uppercase; color: #9c8749; margin-bottom: 10px; letter-spacing: 0.5px; }
    
    /* Palette */
    .palette-item { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; border: 2px solid transparent; }
    .palette-item:hover { background: rgba(244,192,37,.1); }
    .palette-item.active { border-color: #f4c025; background: rgba(244,192,37,.15); }
    .palette-icon { width: 28px; height: 28px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
    
    /* Center area */
    .center { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    
    /* Toolbar */
    .toolbar { background: #f5f3ee; border-bottom: 2px solid #e8e2ce; padding: 8px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .toolbar button { padding: 6px 12px; border: 1px solid #e8e2ce; background: #fff; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .toolbar button:hover { background: #f4c025; }
    .toolbar button.active { background: #f4c025; }
    .toolbar label { font-size: 11px; color: #9c8749; }
    .toolbar input[type="number"] { width: 60px; padding: 4px; border: 1px solid #e8e2ce; border-radius: 4px; }
    
    /* Viewport */
    .viewport { flex: 1; background: #f5f0e0; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    
    /* Grid container - SIMPLIFIED */
    .grid-wrap { position: relative; }
    #grid-container { display: grid; gap: 0; border: 2px solid #4a3818; background: #4a3818; }
    .grid-cell { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-weight: 700; cursor: pointer; border: 1px solid rgba(0,0,0,.1); user-select: none; }
    .cell-empty { background: #e5d9a8; }
    .cell-wall { background: #4a3818; color: #6b5423; }
    .cell-player { background: #e5d9a8; color: #e53e3e; }
    .cell-target { background: #e5d9a8; color: #f4c025; }
    .cell-switch { background: #e5d9a8; color: #888; }
    .cell-door { background: #e5d9a8; color: #5b3a1a; }
    .cell-door-locked { background: #e5d9a8; color: #8b0000; }
    .cell-key { background: #e5d9a8; color: #ffd700; }
    .cell-npc { background: #e5d9a8; color: #4caf50; }
    .cell-plate { background: #e5d9a8; color: #777; }
    .cell-laser { background: #e5d9a8; color: #cc0000; }
    
    /* Actions panel */
    .actions { width: 180px; background: #fff; border-left: 2px solid #e8e2ce; padding: 15px; }
    .actions h3 { font-size: 12px; text-transform: uppercase; color: #9c8749; margin-bottom: 10px; }
    .actions button { width: 100%; padding: 8px; margin-bottom: 6px; border: 1px solid #e8e2ce; background: #fff; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .actions button:hover { background: #f4c025; }
    .actions button.primary { background: #f4c025; border-color: #f4c025; font-weight: 600; }
    .actions button.play { background: #22863a; color: #fff; border-color: #22863a; }
    
    /* Config inputs */
    .config-input { width: 100%; padding: 6px; border: 1px solid #e8e2ce; border-radius: 4px; margin-bottom: 8px; font-size: 12px; }
    .config-label { font-size: 11px; color: #9c8749; margin-bottom: 4px; display: block; }
    
    /* Mobile */
    @media (max-width: 768px) {
      .sidebar, .actions { display: none; }
      .main { flex-direction: column; }
      .toolbar { flex-wrap: nowrap; overflow-x: auto; }
      .grid-cell { width: 32px; height: 32px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Editor de Niveles</h1>
    <a href="index.html">← Volver al juego</a>
  </div>
  
  <div class="main">
    <!-- Sidebar -->
    <div class="sidebar">
      <h3>Elementos</h3>
      <div id="palette"></div>
    </div>
    
    <!-- Center -->
    <div class="center">
      <div class="toolbar">
        <label>Ancho: <input type="number" id="grid-width" value="8" min="3" max="20"></label>
        <label>Alto: <input type="number" id="grid-height" value="7" min="3" max="20"></label>
        <button onclick="LevelEditorGrid.resizeGrid()">Aplicar</button>
        <div style="width:1px;height:20px;background:#e8e2ce;margin:0 4px"></div>
        <button onclick="LevelEditorGrid.zoomIn()">+</button>
        <button onclick="LevelEditorGrid.zoomOut()">-</button>
        <span id="zoom-label" style="font-size:11px;color:#9c8749">100%</span>
        <button onclick="LevelEditorGrid.zoomReset()">Reset</button>
        <button onclick="LevelEditorGrid.fitToView()">Ajustar</button>
      </div>
      
      <div class="viewport">
        <div class="grid-wrap">
          <div id="grid-container"></div>
        </div>
      </div>
    </div>
    
    <!-- Actions -->
    <div class="actions">
      <h3>Acciones</h3>
      <button class="play" onclick="LevelEditorActions.playCustomLevel()">▶ Jugar nivel</button>
      <button class="primary" onclick="LevelEditorActions.generateCode();LevelEditorActions.switchTab('code')">Generar código</button>
      <button onclick="LevelEditorActions.saveToStorage()">💾 Guardar</button>
      <button onclick="LevelEditorActions.loadFromStorage()">📂 Cargar</button>
      <button onclick="LevelEditorActions.exportJSON()">📥 Exportar JSON</button>
      <button onclick="LevelEditorGrid.clearGrid()">🗑 Limpiar mapa</button>
      
      <h3 style="margin-top:20px">Configuración</h3>
      <label class="config-label">ID del nivel</label>
      <input type="number" id="level-id" class="config-input" value="16" min="1">
      
      <label class="config-label">Nombre</label>
      <input type="text" id="level-name" class="config-input" value="Mi nivel">
      
      <label class="config-label">Descripción</label>
      <textarea id="level-desc" class="config-input" rows="2">Mi nivel personalizado</textarea>
      
      <label class="config-label">Dirección jugador</label>
      <select id="player-dir" class="config-input">
        <option value="derecha">Derecha</option>
        <option value="izquierda">Izquierda</option>
        <option value="arriba">Arriba</option>
        <option value="abajo">Abajo</option>
      </select>
    </div>
  </div>
  
  <!-- Hidden inputs for compatibility -->
  <input type="hidden" id="star-gold" value="10">
  <input type="hidden" id="star-silver" value="20">
  <input type="hidden" id="level-goals" value="Llegar a la meta">
  <input type="hidden" id="level-hints" value="Usa las flechas">
  <input type="hidden" id="level-starter" value="// Código inicial">

  <script src="jseditor/editor-grid.js"></script>
  <script src="jseditor/editor-links.js"></script>
  <script src="jseditor/editor-actions.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (window.LevelEditorGrid) {
        window.LevelEditorGrid.init();
      }
    });
  </script>
</body>
</html>
