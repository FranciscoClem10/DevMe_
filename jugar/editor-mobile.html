<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>DevMe — Editor de Niveles</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link rel="icon" href="imgs/icono.png" type="image/png" />
  <link rel="stylesheet" href="../css/mobile.css" />
  <style>
    body { font-family: 'Lexend', sans-serif; background: #fcfbf8; color: #1c180d; margin: 0; }
    .bg-panal{background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="35" viewBox="0 0 60 35"><path d="M20 0 L40 0 L50 17.5 L40 35 L20 35 L10 17.5 Z M10 17.5 L0 17.5 M50 17.5 L60 17.5 M20 0 L10 17.5 M40 0 L50 17.5 M20 35 L10 17.5 M40 35 L50 17.5" fill="none" stroke="%23a7632b" stroke-opacity="0.05" stroke-width="4"/></svg>');background-size:60px 35px;background-repeat:repeat}
    .grid-canvas{display:inline-grid;gap:0;border:2px solid #4a3818;border-radius:4px;background:#4a3818}
    .grid-cell{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;cursor:pointer;position:relative;border:1px solid rgba(0,0,0,.08);user-select:none;-webkit-user-select:none}
    .grid-cell:active{outline:2px solid #f4c025;outline-offset:-2px;z-index:2}
    .cell-empty{background:#e5d9a8}.cell-wall{background:#4a3818;color:#6b5423}.cell-player{background:#e5d9a8;color:#e53e3e}.cell-target{background:#e5d9a8;color:#f4c025}.cell-box{background:#e5d9a8;color:#a56526}.cell-switch{background:#e5d9a8;color:#888}.cell-door{background:#e5d9a8;color:#5b3a1a}.cell-door-locked{background:#e5d9a8;color:#8b0000}.cell-key{background:#e5d9a8;color:#ffd700}.cell-item{background:#e5d9a8;color:#4488ff}.cell-npc{background:#e5d9a8;color:#4caf50}.cell-plate{background:#e5d9a8;color:#777}.cell-laser{background:#e5d9a8;color:#cc0000}.cell-enemy{background:#e5d9a8;color:#d32f2f}.cell-piston{background:#e5d9a8;color:#607d8b}
    .palette-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:all .15s;border:2px solid transparent;font-size:12px;font-weight:500}
    .palette-item:active{background:rgba(244,192,37,.15)}
    .palette-item.active{border-color:#f4c025;background:rgba(244,192,37,.15);font-weight:600}
    .palette-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
    .code-output{font-family:"Consolas","Monaco",monospace;font-size:11px;line-height:1.5;background:#1c180d;color:#fde68a;padding:12px;border-radius:8px;overflow:auto;white-space:pre;max-height:300px;tab-size:4}
    .config-input{padding:8px 10px;border:1px solid #e8e2ce;border-radius:8px;font-family:inherit;font-size:13px;background:#fff;color:#1c180d;width:100%}
    .config-textarea{padding:8px 10px;border:1px solid #e8e2ce;border-radius:8px;font-family:inherit;font-size:12px;background:#fff;color:#1c180d;resize:vertical;min-height:60px;width:100%}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9999px;font-weight:600;font-size:12px;cursor:pointer;transition:all .15s;border:none}
    .btn-primary{background:#f4c025;color:#1c180d}
    .btn-primary:active{background:#e5b321;transform:scale(0.96)}
    .btn-outline{background:transparent;color:#9c8749;border:2px solid #e8e2ce}
    .btn-outline:active{border-color:#f4c025;background:rgba(244,192,37,.08)}
    .btn-play{background:#22863a;color:#fff}
    .btn-play:active{background:#1a6b2e;transform:scale(0.96)}
    .mobile-editor-layout{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
    .mobile-tabs{display:flex;background:#f5f3ee;border-bottom:1px solid #e8e2ce;overflow-x:auto;-webkit-overflow-scrolling:touch;flex-shrink:0}
    .mobile-tabs::-webkit-scrollbar{display:none}
    .mobile-tab{display:flex;align-items:center;gap:4px;padding:10px 14px;background:transparent;border:none;color:#9c8749;font-size:11px;font-weight:500;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent;flex-shrink:0}
    .mobile-tab.active{color:#1c180d;border-bottom-color:#f4c025;font-weight:600}
    .mobile-tab .material-symbols-outlined{font-size:16px}
    .tab-content{display:none;flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
    .tab-content.active{display:flex;flex-direction:column}
    .palette-scroll{display:flex;gap:4px;padding:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;flex-shrink:0;background:#f5f3ee;border-bottom:1px solid #e8e2ce}
    .palette-scroll::-webkit-scrollbar{display:none}
    .grid-viewport{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:flex-start;justify-content:center;padding:16px;background:#f5f0e0}
    .bottom-actions{display:flex;gap:6px;padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));background:#f5f3ee;border-top:1px solid #e8e2ce;flex-shrink:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
    .bottom-actions::-webkit-scrollbar{display:none}
  </style>
</head>
<body class="bg-panal">
  <div class="mobile-editor-layout">
    <!-- Header -->
    <div class="mobile-header">
      <div class="logo">
        <img src="imgs/icono.png" alt="DevMe" style="width:28px;height:28px;border-radius:50%" />
        <div class="logo-text">
          <h1>Editor de Niveles</h1>
          <p>DevMe</p>
        </div>
      </div>
      <div class="header-actions">
        <a href="index-mobile.html" class="mobile-btn-icon" title="Juego">
          <span class="material-symbols-outlined">sports_esports</span>
        </a>
        <a href="../index-mobile.html" class="mobile-btn-icon" title="Inicio">
          <span class="material-symbols-outlined">home</span>
        </a>
      </div>
    </div>

    <!-- Palette scroll -->
    <div class="palette-scroll" id="palette"></div>

    <!-- Tabs -->
    <div class="mobile-tabs">
      <button class="mobile-tab active" data-tab="grid" onclick="switchTab('grid')"><span class="material-symbols-outlined">grid_on</span> Mapa</button>
      <button class="mobile-tab" data-tab="config" onclick="switchTab('config')"><span class="material-symbols-outlined">settings</span> Config</button>
      <button class="mobile-tab" data-tab="links" onclick="switchTab('links')"><span class="material-symbols-outlined">link</span> Vinculos</button>
      <button class="mobile-tab" data-tab="code" onclick="switchTab('code')"><span class="material-symbols-outlined">code</span> Codigo</button>
      <button class="mobile-tab" data-tab="import" onclick="switchTab('import')"><span class="material-symbols-outlined">upload_file</span> Importar</button>
    </div>

    <!-- Tab: Grid -->
    <div id="tab-grid" class="tab-content active">
      <div class="grid-viewport">
        <div id="grid-container" class="grid-canvas"></div>
      </div>
    </div>

    <!-- Tab: Config -->
    <div id="tab-config" class="tab-content" style="padding:12px;">
      <div style="display:flex;flex-direction:column;gap:10px;">
        <div><label style="font-size:11px;font-weight:700;text-transform:uppercase;color:#9c8749;">ID del nivel</label><input type="number" id="level-id" class="config-input" value="16" min="1" /></div>
        <div><label style="font-size:11px;font-weight:700;text-transform:uppercase;color:#9c8749;">Nombre</label><input type="text" id="level-name" class="config-input" value="Mi nivel" /></div>
        <div><label style="font-size:11px;font-weight:700;text-transform:uppercase;color:#9c8749;">Descripcion</label><textarea id="level-desc" class="config-textarea">Describe el objetivo de este nivel...</textarea></div>
        <div><label style="font-size:11px;font-weight:700;text-transform:uppercase;color:#9c8749;">Objetivos (uno por linea)</label><textarea id="level-goals" class="config-textarea">Llegar a la meta</textarea></div>
        <div><label style="font-size:11px;font-weight:700;text-transform:uppercase;color:#9c8749;">Pistas (una por linea)</label><textarea id="level-hints" class="config-textarea">Usa avanzar() para moverte.</textarea></div>
        <div style="display:flex;gap:8px;">
          <div style="flex:1;"><label style="font-size:11px;font-weight:700;text-transform:uppercase;color:#9c8749;">Oro</label><input type="number" id="star-gold" class="config-input" value="10" min="1" /></div>
          <div style="flex:1;"><label style="font-size:11px;font-weight:700;text-transform:uppercase;color:#9c8749;">Plata</label><input type="number" id="star-silver" class="config-input" value="20" min="1" /></div>
        </div>
        <div><label style="font-size:11px;font-weight:700;text-transform:uppercase;color:#9c8749;">Codigo inicial</label><textarea id="level-starter" class="config-textarea" style="font-family:monospace;font-size:11px;min-height:80px">Algoritmo Nivel
    // Escribe tu codigo aqui
FinAlgoritmo</textarea></div>
        <input type="hidden" id="player-dir" value="derecha" />
        <input type="hidden" id="grid-width" value="8" />
        <input type="hidden" id="grid-height" value="7" />
      </div>
    </div>

    <!-- Tab: Links -->
    <div id="tab-links" class="tab-content" style="padding:12px;">
      <p style="font-size:11px;color:#9c8749;margin:0 0 8px;">Configura las propiedades de los elementos del nivel.</p>
      <div id="links-container"></div>
    </div>

    <!-- Tab: Code -->
    <div id="tab-code" class="tab-content" style="padding:12px;">
      <div style="display:flex;gap:6px;margin-bottom:8px;">
        <button class="btn btn-primary" onclick="generateCode()"><span class="material-symbols-outlined" style="font-size:16px">refresh</span> Generar</button>
        <button class="btn btn-outline" onclick="copyCode()"><span class="material-symbols-outlined" style="font-size:16px">content_copy</span> Copiar</button>
      </div>
      <pre id="code-output" class="code-output"></pre>
    </div>

    <!-- Tab: Import -->
    <div id="tab-import" class="tab-content" style="padding:12px;">
      <p style="font-size:11px;color:#9c8749;margin:0 0 8px;">Pega el JSON de un nivel para importarlo.</p>
      <textarea id="import-input" class="config-textarea" style="font-family:monospace;font-size:11px;min-height:150px;" placeholder="Pega aqui el JSON del nivel..."></textarea>
      <button class="btn btn-primary" style="margin-top:8px;" onclick="importLevel()"><span class="material-symbols-outlined" style="font-size:16px">upload_file</span> Importar</button>
    </div>

    <!-- Bottom actions -->
    <div class="bottom-actions">
      <button class="btn btn-play" onclick="playCustomLevel()"><span class="material-symbols-outlined" style="font-size:16px">sports_esports</span> Jugar</button>
      <button class="btn btn-primary" onclick="generateCode(); switchTab('code')"><span class="material-symbols-outlined" style="font-size:16px">code</span> Generar</button>
      <button class="btn btn-outline" onclick="clearGrid()"><span class="material-symbols-outlined" style="font-size:16px">delete_outline</span> Limpiar</button>
      <button class="btn btn-outline" onclick="saveToStorage()"><span class="material-symbols-outlined" style="font-size:16px">save</span> Guardar</button>
      <button class="btn btn-outline" onclick="loadFromStorage()"><span class="material-symbols-outlined" style="font-size:16px">folder_open</span> Cargar</button>
      <button class="btn btn-outline" onclick="exportJSON()"><span class="material-symbols-outlined" style="font-size:16px">download</span> JSON</button>
    </div>
  </div>

  <!-- Load the same editor script as PC version -->
  <script>
    // The editor.html has a large inline script. For mobile we load a simplified version.
    // We'll include the key functions needed.
  </script>
</body>
</html>
