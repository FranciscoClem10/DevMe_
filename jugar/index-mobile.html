<!DOCTYPE html>
<html class="light" lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>DevMe — Juego</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <link rel="icon" href="imgs/icono.png" type="image/png" />
  <link rel="stylesheet" href="../css/mobile.css" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#f4c025",
            "background-light": "#fcfbf8",
            "text-light": "#1c180d",
            "text-light-muted": "#9c8749",
            "border-light": "#e8e2ce",
          },
          fontFamily: { "display": ["Lexend", "sans-serif"] },
          borderRadius: { "DEFAULT": "1rem", "lg": "1.5rem", "xl": "2rem", "full": "9999px" },
        },
      },
    }
  </script>
  <style>
    /* PLACEHOLDER: styles will be filled in */
    .bg-panal { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="35" viewBox="0 0 60 35"><path d="M20 0 L40 0 L50 17.5 L40 35 L20 35 L10 17.5 Z M10 17.5 L0 17.5 M50 17.5 L60 17.5 M20 0 L10 17.5 M40 0 L50 17.5 M20 35 L10 17.5 M40 35 L50 17.5" fill="none" stroke="%23a7632b" stroke-opacity="0.05" stroke-width="4"/></svg>'); background-size: 60px 35px; background-repeat: repeat; }
    
    /* Game layout mobile */
    .mobile-game-layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    
    /* Canvas area */
    .game-canvas-area {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #3a3218;
      padding: 8px;
      position: relative;
    }
    #game-canvas {
      max-width: 100%;
      max-height: 40vh;
      image-rendering: pixelated;
      border-radius: 8px;
    }
    .game-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(34,30,16,0.92);
      color: #fcfbf8;
      font-size: 1rem;
      font-weight: 600;
      padding: 1rem;
      text-align: center;
      pointer-events: none;
      backdrop-filter: blur(4px);
      border-radius: 8px;
    }
    .game-overlay.hidden { display: none; }
    .game-overlay.error { background: rgba(179,29,40,0.88); }
    
    /* Controls area */
    .controls-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      background: #fcfbf8;
    }
    
    /* Editor section */
    .editor-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .editor-section textarea {
      flex: 1;
      width: 100%;
      padding: 10px 12px;
      border: none;
      outline: none;
      resize: none;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
      line-height: 1.5;
      background: #fcfbf8;
      color: #1c180d;
      tab-size: 4;
    }
    
    /* Syntax highlighting tokens */
    .tok-kw{color:#1200ff;font-weight:bold} .tok-type{color:#e404ff} .tok-str{color:#22a324} .tok-num{color:#ff0000} .tok-cmt{color:#048b86;font-style:italic} .tok-op{color:#e6b01d} .tok-bool{color:#005cc5} .tok-name{color:#6f42c1} .tok-var{color:#e36209} .tok-game{color:#4A148C;font-weight:600}
    
    /* Bottom controls */
    .bottom-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
      background: #f5f3ee;
      border-top: 1px solid #e8e2ce;
      flex-shrink: 0;
    }
    .bottom-controls .ctrl-group {
      display: flex;
      gap: 4px;
    }
    .bottom-controls .ctrl-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: #9c8749;
      cursor: pointer;
      transition: all 0.15s;
    }
    .bottom-controls .ctrl-btn:active {
      background: rgba(244,192,37,0.2);
      color: #1c180d;
    }
    .bottom-controls .ctrl-btn.run-btn {
      width: 48px;
      height: 48px;
      background: #f4c025;
      color: #1c180d;
      box-shadow: 0 2px 8px rgba(244,192,37,0.4);
    }
    .bottom-controls .ctrl-btn.run-btn:active {
      background: #e5b321;
      transform: scale(0.92);
    }
    .bottom-controls .ctrl-btn .material-symbols-outlined {
      font-size: 22px;
    }
    .bottom-controls .ctrl-btn.run-btn .material-symbols-outlined {
      font-size: 28px;
    }
    
    /* Speed slider */
    .speed-slider {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: #9c8749;
    }
    .speed-slider input[type=range] {
      flex: 1;
      accent-color: #f4c025;
      height: 16px;
    }
    
    /* Level modal */
    .level-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      z-index: 300;
      display: none;
      align-items: flex-end;
    }
    .level-modal.open {
      display: flex;
    }
    .level-modal-content {
      background: #fcfbf8;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      width: 100%;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .level-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-bottom: 1px solid #e8e2ce;
    }
    .level-modal-header h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }
    .level-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 8px;
      padding: 12px 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .level-card {
      padding: 10px;
      border-radius: 12px;
      background: #f5f3ee;
      border: 2px solid #e8e2ce;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: all 0.15s;
    }
    .level-card:active {
      border-color: #f4c025;
      transform: scale(0.96);
    }
    .level-card.locked {
      opacity: 0.5;
      pointer-events: none;
    }
    
    /* Win modal */
    .win-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .win-modal.open {
      display: flex;
    }
    .win-modal-content {
      background: #fcfbf8;
      border-radius: 20px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    
    /* Console sheet */
    .console-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fcfbf8;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
      z-index: 200;
      transform: translateY(calc(100% - 44px));
      transition: transform 0.3s ease;
      max-height: 60vh;
      display: flex;
      flex-direction: column;
    }
    .console-sheet.open {
      transform: translateY(0);
    }
    .console-sheet .sheet-handle {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .console-sheet .sheet-handle::before {
      content: '';
      width: 40px;
      height: 4px;
      border-radius: 2px;
      background: #e8e2ce;
    }
    .console-sheet .sheet-tabs {
      display: flex;
      border-bottom: 1px solid #e8e2ce;
      flex-shrink: 0;
    }
    .console-sheet .sheet-tab {
      flex: 1;
      padding: 8px;
      background: transparent;
      border: none;
      color: #9c8749;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .console-sheet .sheet-tab.active {
      color: #1c180d;
      border-bottom-color: #f4c025;
    }
    .console-sheet .sheet-content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .console-output {
      padding: 10px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      color: #1c180d;
      min-height: 80px;
    }
    .console-output .out { color: #1c180d; }
    .console-output .in { color: #005cc5; }
    .console-output .info { color: #9c8749; font-style: italic; }
    .console-output .err { color: #b31d28; }
    .console-output .ok { color: #22863a; }
    
    /* Input line for Read */
    .input-line {
      padding: 8px;
      background: #f5f3ee;
      border-top: 1px solid #e8e2ce;
      display: none;
      gap: 6px;
      align-items: center;
    }
    .input-line.visible {
      display: flex;
    }
    .input-line input {
      flex: 1;
      padding: 8px 10px;
      background: #fff;
      color: #1c180d;
      border: 1px solid #d0c8b4;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
    }
    .input-line input:focus {
      outline: 2px solid #f4c025;
      border-color: transparent;
    }
    .input-line button {
      padding: 8px 14px;
      background: #f4c025;
      color: #1c180d;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    
    /* Level info panel */
    .level-info {
      padding: 12px;
    }
    .level-info .goal-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 8px;
      background: rgba(0,0,0,0.03);
      font-size: 13px;
      margin-bottom: 4px;
    }
    .level-info .goal-item .material-symbols-outlined {
      font-size: 18px;
      color: #9c8749;
    }
    .level-info .goal-item.done {
      background: rgba(34,134,58,0.1);
    }
    .level-info .goal-item.done .material-symbols-outlined {
      color: #22863a;
    }
    
    /* Block editor mobile */
    .block-workspace-mobile {
      width: 100%;
      height: 100%;
      overflow: auto;
      background: #f9f8f5;
      position: relative;
      -webkit-overflow-scrolling: touch;
    }
    
    /* Quick action buttons for game commands */
    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 6px 8px;
      background: #f5f3ee;
      border-top: 1px solid #e8e2ce;
      flex-shrink: 0;
    }
    .quick-action-btn {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 5px 8px;
      border-radius: 6px;
      background: #fff;
      border: 1px solid #e8e2ce;
      color: #1c180d;
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.1s;
    }
    .quick-action-btn:active {
      background: #f4c025;
      border-color: #f4c025;
      transform: scale(0.95);
    }
    .quick-action-btn .material-symbols-outlined {
      font-size: 14px;
    }
  </style>
</head>
<body class="bg-background-light font-display text-text-light overflow-hidden">
  <div class="mobile-game-layout">
    <!-- Header -->
    <div class="mobile-header">
      <div class="logo">
        <img src="imgs/icono.png" alt="DevMe" />
        <div class="logo-text">
          <h1 id="game-level-title">Nivel 1</h1>
          <p id="game-level-subtitle">Primeros pasos</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-levels" class="mobile-btn-icon" title="Niveles">
          <span class="material-symbols-outlined">grid_view</span>
        </button>
        <span id="game-status-chip" class="mobile-game-info .status-chip">Listo</span>
      </div>
    </div>

    <!-- Game info bar -->
    <div class="mobile-game-info">
      <span class="level-name" id="game-level-label">Nivel 1</span>
      <span id="game-instr-count">0</span> instr.
      <span id="game-stars-display" style="font-size:14px;">
        <span style="color:#e8e2ce;">&#9733;</span>
        <span style="color:#e8e2ce;">&#9733;</span>
        <span style="color:#e8e2ce;">&#9733;</span>
      </span>
    </div>

    <!-- Canvas -->
    <div class="game-canvas-area">
      <canvas id="game-canvas" width="640" height="640"></canvas>
      <div id="game-overlay" class="game-overlay hidden"></div>
    </div>

    <!-- Controls area -->
    <div class="controls-area">
      <!-- Tabs -->
      <div class="mobile-tabs">
        <button class="mobile-tab active" data-tab="editor">
          <span class="material-symbols-outlined">code</span> Codigo
        </button>
        <button class="mobile-tab" data-tab="goals">
          <span class="material-symbols-outlined">flag</span> Nivel
        </button>
        <button class="mobile-tab" data-tab="hints">
          <span class="material-symbols-outlined">lightbulb</span> Pistas
        </button>
      </div>

      <!-- Tab content -->
      <div class="editor-section">
        <!-- Editor tab -->
        <div id="tab-editor" class="tab-panel" style="display:flex;flex-direction:column;flex:1;min-height:0;">
          <!-- Quick actions -->
          <div class="quick-actions scroll-x">
            <button class="quick-action-btn" data-cmd="avanzar()"><span class="material-symbols-outlined">arrow_forward</span>avanzar</button>
            <button class="quick-action-btn" data-cmd="girar(-90)"><span class="material-symbols-outlined">rotate_left</span>girar izq</button>
            <button class="quick-action-btn" data-cmd="girar(90)"><span class="material-symbols-outlined">rotate_right</span>girar der</button>
            <button class="quick-action-btn" data-cmd="tomar()"><span class="material-symbols-outlined">inventory</span>tomar</button>
            <button class="quick-action-btn" data-cmd="soltar()"><span class="material-symbols-outlined">inventory_2</span>soltar</button>
            <button class="quick-action-btn" data-cmd="abrir()"><span class="material-symbols-outlined">lock_open</span>abrir</button>
            <button class="quick-action-btn" data-cmd="activar()"><span class="material-symbols-outlined">toggle_on</span>activar</button>
            <button class="quick-action-btn" data-cmd="desactivar()"><span class="material-symbols-outlined">toggle_off</span>desactivar</button>
            <button class="quick-action-btn" data-cmd="entregar()"><span class="material-symbols-outlined">volunteer_activism</span>entregar</button>
            <button class="quick-action-btn" data-cmd="empujar()"><span class="material-symbols-outlined">pan_tool</span>empujar</button>
          </div>
          <textarea id="editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="Escribe tu pseudocodigo aqui..."></textarea>
        </div>

        <!-- Goals tab -->
        <div id="tab-goals" class="tab-panel level-info" style="display:none;overflow-y:auto;flex:1;">
          <div id="game-goals"></div>
          <div style="margin-top:12px;">
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#9c8749;margin-bottom:6px;">Descripcion</div>
            <div id="game-desc" style="font-size:13px;line-height:1.5;"></div>
          </div>
        </div>

        <!-- Hints tab -->
        <div id="tab-hints" class="tab-panel level-info" style="display:none;overflow-y:auto;flex:1;">
          <div id="game-hints"></div>
        </div>
      </div>
    </div>

    <!-- Speed bar -->
    <div class="mobile-speed-bar">
      <span class="material-symbols-outlined" style="font-size:14px;">speed</span>
      <input type="range" id="game-speed" min="50" max="800" value="550" />
      <span id="game-speed-lbl" style="font-weight:600;color:#f4c025;min-width:40px;">300ms</span>
    </div>

    <!-- Bottom controls -->
    <div class="bottom-controls">
      <div class="ctrl-group">
        <button id="btn-stop" class="ctrl-btn" style="display:none" title="Detener">
          <span class="material-symbols-outlined">stop</span>
        </button>
        <button id="btn-pause" class="ctrl-btn" style="display:none" title="Pausar">
          <span class="material-symbols-outlined">pause</span>
        </button>
        <button id="btn-reset" class="ctrl-btn" title="Reiniciar">
          <span class="material-symbols-outlined">restart_alt</span>
        </button>
      </div>
      <button id="btn-run" class="ctrl-btn run-btn" title="Ejecutar">
        <span class="material-symbols-outlined">play_arrow</span>
      </button>
      <div class="speed-slider">
        <button id="btn-console" class="ctrl-btn" title="Consola">
          <span class="material-symbols-outlined">terminal</span>
        </button>
      </div>
      <div class="ctrl-group">
        <a href="editor-mobile.html" class="ctrl-btn" title="Editor">
          <span class="material-symbols-outlined">edit_note</span>
        </a>
        <a href="../index-mobile.html" class="ctrl-btn" title="Inicio">
          <span class="material-symbols-outlined">home</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Console sheet -->
  <div id="console-sheet" class="console-sheet">
    <div class="sheet-handle" id="console-handle"></div>
    <div class="sheet-tabs">
      <button class="sheet-tab active" data-sheet-tab="console">Consola</button>
      <button class="sheet-tab" data-sheet-tab="errors">Errores</button>
      <button class="sheet-tab" data-sheet-tab="level">Nivel</button>
    </div>
    <div class="sheet-content">
      <div id="sheet-console" class="sheet-panel">
        <div id="console" class="console-output bg-panal"></div>
        <div id="input-line" class="input-line">
          <span id="input-prompt" style="color:#005cc5;font-size:12px;font-weight:500;">Entrada:</span>
          <input type="text" id="stdin" autocomplete="off" />
          <button id="btn-send">Enviar</button>
        </div>
      </div>
      <div id="sheet-errors" class="sheet-panel" style="display:none;">
        <div id="errors" class="console-output"></div>
      </div>
      <div id="sheet-level" class="sheet-panel" style="display:none;">
        <div class="level-info">
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#9c8749;margin-bottom:6px;">Objetivos</div>
          <div id="game-goals-sheet"></div>
          <div style="margin-top:12px;">
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#9c8749;margin-bottom:6px;">Descripcion</div>
            <div id="game-desc-sheet" style="font-size:13px;line-height:1.5;"></div>
          </div>
          <div style="margin-top:12px;">
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#9c8749;margin-bottom:6px;">Pistas</div>
            <div id="game-hints-sheet"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Level modal -->
  <div id="game-levels-modal" class="level-modal">
    <div class="level-modal-content">
      <div class="level-modal-header">
        <h2>Selecciona un nivel</h2>
        <button id="game-close-levels" style="background:none;border:none;cursor:pointer;color:#9c8749;font-size:20px;">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div id="game-levels-grid" class="level-grid"></div>
    </div>
  </div>

  <!-- Win modal -->
  <div id="game-win-modal" class="win-modal">
    <div class="win-modal-content">
      <div style="font-size:48px;color:#f4c025;display:flex;justify-content:center;">
        <span class="material-symbols-outlined" style="font-size:48px;">emoji_events</span>
      </div>
      <h2 style="margin:12px 0 8px;font-size:18px;">Nivel completado!</h2>
      <div id="game-win-stats" style="display:flex;justify-content:center;gap:16px;padding:8px 0;font-size:14px;"></div>
      <div id="game-win-stars" style="font-size:28px;color:#e8e2ce;"></div>
      <div style="display:flex;justify-content:center;gap:12px;margin-top:16px;">
        <button id="game-win-retry" class="mobile-btn mobile-btn-outline">
          <span class="material-symbols-outlined" style="font-size:16px;">refresh</span> Reintentar
        </button>
        <button id="game-win-next" class="mobile-btn mobile-btn-primary">
          <span class="material-symbols-outlined" style="font-size:16px;">arrow_forward</span> Siguiente
        </button>
      </div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="js/lexer.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/semantic.js"></script>
  <script src="js/interpreter.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/examples.js"></script>
  <script src="js/diagramGenerator.js"></script>
  <script src="js/blockEditor.js"></script>
